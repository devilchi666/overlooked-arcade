<?xml version="1.0" encoding="UTF-8"?>
<!-- Aurora — the theme's own self-contained backdrop (tier 0 of the asset
     cascade: themes/community/aurora/system-ui/_baseline/backgrounds/). A dark
     aurora-borealis wash, kept low-key so cover art reads on top. Text-authored
     vector (no binary) — scales to any resolution. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1430"/>
      <stop offset="55%" stop-color="#070b1c"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="teal" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#2fd6c4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2fd6c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="74%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#7a5cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="52%" cy="14%" r="48%">
      <stop offset="0%" stop-color="#5effa8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#5effa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- aurora ribbons: soft blurred bands drifting across the upper sky -->
  <g filter="url(#soft)" opacity="0.9">
    <path d="M-100 300 C 400 120, 900 360, 1400 180 S 2100 240, 2100 240 L 2100 460 C 1500 380, 900 540, 300 460 S -100 520, -100 520 Z" fill="url(#green)"/>
    <ellipse cx="560" cy="320" rx="700" ry="260" fill="url(#teal)"/>
    <ellipse cx="1420" cy="250" rx="620" ry="240" fill="url(#violet)"/>
  </g>

  <!-- gentle vignette so the edges fall off and centred art pops -->
  <radialGradient id="vignette" cx="50%" cy="46%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#04060f" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
