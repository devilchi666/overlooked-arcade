[package]
name = "oa-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates — every Phase-1 crate is referenced so the dep graph is wired.
oa-core      = { workspace = true }
oa-render    = { workspace = true }
oa-audio     = { workspace = true }
oa-input     = { workspace = true }
oa-platform  = { workspace = true }
oa-content   = { workspace = true }
oa-savestate = { workspace = true }
oa-cdrom     = { workspace = true }
oa-libretro  = { workspace = true }

# External
tauri                        = { workspace = true }
tauri-plugin-dialog          = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
raw-window-handle   = { workspace = true }
log                 = { workspace = true }
env_logger          = { workspace = true }
time                = { version = "0.3", default-features = false, features = ["formatting", "macros", "local-offset"] }
serde               = { workspace = true }
serde_json          = { workspace = true }
toml                = { workspace = true }
png                 = "0.17"
base64              = "0.22"
sha1                = "0.10"
reqwest             = { workspace = true }
image               = { workspace = true }
strsim              = { workspace = true }
urlencoding         = { workspace = true }
futures             = { workspace = true }
rusqlite            = { workspace = true }
zip                 = { workspace = true }
sevenz-rust         = { workspace = true }
notify              = { workspace = true }
tokio               = { workspace = true }
