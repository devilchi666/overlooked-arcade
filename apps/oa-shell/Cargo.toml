[package]
name = "oa-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Standard Tauri 2 feature wiring. `custom-protocol` MUST be enabled for
# production builds — tauri-2.x's build.rs sets `cfg(dev)` whenever
# `custom-protocol` is OFF, and the runtime's `get_app_url` uses that
# cfg to choose between devUrl and frontendDist. Without this feature,
# `cargo build --release` produces a binary that still tries to load
# from the dev server URL (typically `http://127.0.0.1:5173`), which
# fails in production with `ERR_CONNECTION_REFUSED` because no Vite
# server is running.
#
# The Tauri CLI (`cargo tauri build`) adds `--features custom-protocol`
# automatically. With the explicit feature declared here, plain
# `cargo build --release` also works correctly.
[features]
# `devtools` is in default so the operator's `cargo tauri build` (a release
# build) still ships the WebView inspector for the Settings → About → Developer
# tools "Open inspector" button. REMOVE from default before any public release
# (see PARKING_LOT 2026-06-14 — dev-tools re-gating).
default = ["custom-protocol", "devtools"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates — every Phase-1 crate is referenced so the dep graph is wired.
oa-core      = { workspace = true }
oa-render    = { workspace = true }
oa-audio     = { workspace = true }
oa-input     = { workspace = true }
oa-platform  = { workspace = true }
oa-content   = { workspace = true }
oa-savestate = { workspace = true }
oa-cdrom     = { workspace = true }
oa-libretro  = { workspace = true }

# External
tauri                        = { workspace = true }
tauri-plugin-dialog          = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
raw-window-handle   = { workspace = true }
log                 = { workspace = true }
env_logger          = { workspace = true }
time                = { version = "0.3", default-features = false, features = ["formatting", "macros", "local-offset"] }
serde               = { workspace = true }
serde_json          = { workspace = true }
# Game Info Panel v1 — multi-document YAML in docs/cores/<id>/games-info.md.
# serde_yaml is technically deprecated upstream but remains the de-facto
# YAML implementation in the Rust ecosystem; the API is stable and shipping
# fixed versions removes the maintenance question.
serde_yaml          = "0.9"
toml                = { workspace = true }
png                 = "0.17"
base64              = "0.22"
sha1                = "0.10"
# System Info Panel v1 (Phase 2) — parses the slim history.xml that
# tools/mame-extractor emits. Matches the extractor's version so any
# parser-level quirks reproduce on both sides.
quick-xml           = "0.36"
reqwest             = { workspace = true }
image               = { workspace = true }
strsim              = { workspace = true }
urlencoding         = { workspace = true }
futures             = { workspace = true }
rusqlite            = { workspace = true }
zip                 = { workspace = true }
sevenz-rust         = { workspace = true }
chd                 = "0.3"
notify              = { workspace = true }
tokio               = { workspace = true }
rodio               = { workspace = true }
clap                = { version = "4", features = ["derive"] }
rayon               = { workspace = true }
# Retroverse-UI Phase C2 — System Status gauges. Default features are
# fine; we only need CPU/RAM + per-disk free space.
sysinfo             = "0.32"
