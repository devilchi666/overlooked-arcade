[package]
name = "migrate-systems"
version = "0.1.0"
edition = "2021"
publish = false
description = "Slice 2 of the per-system descriptor consolidation. One-shot dev tool: reads the OA Rust source files (BIOS const tables, CATALOG, libretro_dat_refs_for_system, LIGHT_GUN_SYSTEMS, default_core_dll_for_system) + the in-tree docs/cores/<id>/system-info.yaml + games-info.md, emits the consolidated config/systems/<id>/{system,bios,games}.yaml triple. Deleted alongside the migrated const tables in Phase D."

# Standalone workspace root — keeps this tool out of the project-wide
# `cargo build --workspace` and `cargo test --workspace` runs. Same
# convention as tools/mame-extractor/. The tool runs ONCE in Slice 2 to
# emit the 38 remaining systems' YAMLs; afterwards both this tool and
# the L1 const tables get deleted in Phase D.
[workspace]

[[bin]]
name = "migrate-systems"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Regex-based parsing of Rust source. The const tables follow predictable
# shapes (`const FOO_BIOS_KNOWN_HASHES: &[(&str, &str, &str)] = &[ ("a",
# "b", "c"), ... ];`); a proper Rust parser (syn) is overkill for a tool
# we delete in Phase D.
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
