[package]
name = "mame-extractor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Slims MAME -listxml + history.dat down to the ~40 machines OA cares about; emits compact JSON consumed by oa-shell's System Info Panel at bake-on-launch time."

# Standalone workspace root — keeps this tool out of the project-wide
# `cargo build --workspace` and `cargo test --workspace` runs. The extractor
# is a maintainer-only utility (invoked by `tools/bump-mame.sh` against a
# locally-installed MAME); it pulls in quick-xml + clap which we don't want
# weighing on every full-workspace build. See `docs/PLANS/system-info-panel-v1.md`
# §4 for the file-layout context.
[workspace]

[[bin]]
name = "mame-extractor"
path = "src/main.rs"

[dependencies]
# Streaming XML reader. MAME's `-listxml` output is 200MB+ on recent
# releases; a DOM parser like roxmltree would balloon to ~600MB of
# resident memory. quick-xml's event API lets us filter on-the-fly,
# keeping peak memory bounded by the per-machine working set.
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minimal arg-parser. We only have four flags; the derive macros add
# ~5s to the cold build, which is fine for a tool we recompile rarely.
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
