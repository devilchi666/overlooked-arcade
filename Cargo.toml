[workspace]
resolver = "2"
members = [
    "apps/oa-shell",
    "crates/oa-core",
    "crates/oa-render",
    "crates/oa-audio",
    "crates/oa-input",
    "crates/oa-platform",
    "crates/oa-content",
    "crates/oa-savestate",
    "crates/oa-cdrom",
    "crates/oa-pce-sys",
    "crates/oa-pce",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-2.0"
repository = "https://github.com/REPLACE-ME"
publish = false

# Shared dependency versions. Crates opt in via `dep = { workspace = true }`.
[workspace.dependencies]
# Local workspace crates
oa-core      = { path = "crates/oa-core" }
oa-render    = { path = "crates/oa-render" }
oa-audio     = { path = "crates/oa-audio" }
oa-input     = { path = "crates/oa-input" }
oa-platform  = { path = "crates/oa-platform" }
oa-content   = { path = "crates/oa-content" }
oa-savestate = { path = "crates/oa-savestate" }
oa-cdrom     = { path = "crates/oa-cdrom" }
oa-pce-sys   = { path = "crates/oa-pce-sys" }
oa-pce       = { path = "crates/oa-pce" }

# External
tauri              = { version = "2", features = ["unstable"] }
tauri-build        = { version = "2", features = [] }
wgpu               = "23"
raw-window-handle  = "0.6"
pollster           = "0.3"
bytemuck           = { version = "1", features = ["derive"] }
cpal               = "0.15"
ringbuf            = "0.4"
gilrs              = "0.11"
device_query       = "4"
cc                 = "1"
log                = "0.4"
env_logger         = "0.11"
thiserror          = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
zstd               = "0.13"
directories        = "5"

[profile.dev]
opt-level = 1                  # Light optimization keeps debug builds usable at 60fps.

[profile.dev.package."*"]
opt-level = 3                  # External deps optimize hard so they only build once well.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
