[workspace]
resolver = "2"
members = [
    "apps/oa-shell",
    "crates/oa-core",
    "crates/oa-render",
    "crates/oa-audio",
    "crates/oa-input",
    "crates/oa-platform",
    "crates/oa-content",
    "crates/oa-savestate",
    "crates/oa-cdrom",
    "crates/oa-libretro",
    "crates/oa-packs",
]
# Retired 2026-05-16 (pivoted to libretro dynamic loading). Source trees stay
# in place under crates/oa-pce-sys/ + crates/oa-pce/ as a historical reference
# and as the basis for future .dll builds we ship of our forked Beetle PCE Fast.
# They no longer compile as part of `cargo build --workspace`.
exclude = [
    "crates/oa-pce-sys",
    "crates/oa-pce",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-2.0"
repository = "https://github.com/REPLACE-ME"
publish = false

# Shared dependency versions. Crates opt in via `dep = { workspace = true }`.
[workspace.dependencies]
# Local workspace crates
oa-core      = { path = "crates/oa-core" }
oa-render    = { path = "crates/oa-render" }
oa-audio     = { path = "crates/oa-audio" }
oa-input     = { path = "crates/oa-input" }
oa-platform  = { path = "crates/oa-platform" }
oa-content   = { path = "crates/oa-content" }
oa-savestate = { path = "crates/oa-savestate" }
oa-cdrom     = { path = "crates/oa-cdrom" }
oa-libretro  = { path = "crates/oa-libretro" }
oa-packs     = { path = "crates/oa-packs" }

# External
tauri              = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-build        = { version = "2", features = [] }
tauri-plugin-dialog          = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
wgpu               = "23"
raw-window-handle  = "0.6"
# Vulkan bindings for the HW-render pipeline (docs/PLANS/hw-render-pipeline.md).
# M1 stands up a standalone VkDevice for HW-rendered cores (Dolphin, …),
# isolated from wgpu. Default features include `loaded` — the Vulkan loader
# (vulkan-1.dll) is resolved at runtime, so a host without Vulkan fails
# gracefully (D4 capability tiering) rather than failing to launch.
ash                = "0.38"
pollster           = "0.3"
bytemuck           = { version = "1", features = ["derive"] }
cpal               = "0.15"
ringbuf            = "0.4"
# File-driven audio playback (platform music, UI sounds, ceremony, snap audio).
# Wraps cpal output + symphonia decoders. The emulator's audio pipe stays on
# the dedicated `oa-audio` crate (i16 PCM + ring buffer); rodio is for "play
# this .ogg / .mp3 / .flac file" use cases the kiosk plan defines as separate
# buses from live game audio.
rodio              = { version = "0.20", default-features = false, features = ["symphonia-all"] }
gilrs              = "0.11"
device_query       = "4"
cc                 = "1"
log                = "0.4"
env_logger         = "0.11"
thiserror          = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
zstd               = "0.13"
# Work-stealing thread pool for embarrassingly-parallel work — library scan,
# media sync, rewind compression, ROM hashing. Added 2026-05-21 (see
# docs/DECISIONS.md "Multi-core CPU awareness" entry). Used sparingly — the
# emu/audio/renderer threads stay on their dedicated cores.
rayon              = "1.10"
directories        = "5"
libloading         = "0.8"
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
strsim             = "0.11"
urlencoding        = "2"
futures            = "0.3"
# bundled = ship SQLite source statically so users don't need a system SQLite.
# Also enables FTS5 for the library search index.
rusqlite           = { version = "0.32", features = ["bundled", "backup"] }
# Archive support — zip is overwhelmingly common, 7z is the modern preservation
# format. RAR is deliberately omitted: licensing footprint is awkward and
# pure-Rust readers are limited; we route those to a "convert to zip" error.
zip                = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
sevenz-rust        = "0.6"
# Content-pack integrity (oa-packs crate) — sha256 verification of downloaded
# pack zips against the registry-listed hash. Pure, no network. See
# docs/PLANS/content-packs.md §5.
sha2               = "0.10"
# YAML parsing for content-pack `manifest.yml` (oa-packs). serde_yaml is
# deprecated upstream but remains the de-facto serde YAML reader; oa-shell
# already depends on the same 0.9 line for emulator profiles.
serde_yaml         = "0.9"
# Filesystem watcher for folders flagged watch_enabled — picks up newly-
# dropped ROMs without an explicit rescan.
notify             = { version = "8", default-features = false, features = ["macos_kqueue"] }
# Tokio runtime — we already pull it in transitively via reqwest, but call it
# out explicitly so the background scan service's spawn_blocking has a clear
# dependency on it. Same multi-thread runtime everything else shares.
tokio              = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }

[profile.dev]
opt-level = 1                  # Light optimization keeps debug builds usable at 60fps.

[profile.dev.package."*"]
opt-level = 3                  # External deps optimize hard so they only build once well.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
