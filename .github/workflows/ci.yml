name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; this workflow doesn't write to the repo.
permissions:
  contents: read

# When new commits land on a branch, cancel still-running CI for older commits
# on the same branch — saves runner minutes and gets fresh signal faster.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows-only CI as of 2026-06-01. The original matrix included
# ubuntu-latest + macos-latest jobs that ran `cargo build / cargo test`
# against the emulation crates (excluding oa-shell, which has too many
# Tauri Linux deps to be worth installing in CI for non-distribution
# validation). Those jobs were dropped because:
#
#   1. Windows is the operator's dev platform and where releases ship
#      from. Cross-platform drift in the emulation crates is theoretical
#      until Linux / macOS distribution is on the roadmap.
#   2. The ubuntu-latest job repeatedly failed three oa-input tests
#      (analog_tests::identity_routing_preserves_zero / invert_y /
#      keyboard_right_key_drives_positive_x) because `device_query::
#      DeviceState::new()` panics on headless runners with "Could not
#      connect to a X display." Workaround options were xvfb-run, a
#      Linux-only #[cfg] skip, or refactoring tests to a trait+mock —
#      all valid but none earning their keep against speculative
#      cross-platform drift detection.
#   3. macOS GHA runners are ~5-10x runner-minute cost compared to
#      Linux/Windows.
#
# When Linux distribution becomes real: add a separate
# `tauri-build-linux.yml` workflow that installs the full GTK +
# webkit2gtk + glib stack and produces a `.deb` / AppImage / Flatpak
# artifact. That workflow validates the real shipping surface, not
# just the emulation crates in isolation. Same shape applies to a
# macOS bundle when that becomes a goal.

jobs:
  test:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The oa-shell crate's `tauri::generate_context!()` macro embeds
      # the frontend dist into the binary at compile time (frontendDist:
      # "../../frontend/dist" in tauri.conf.json). Without a prior Vite
      # build the macro panics with "this path doesn't exist".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install + boundary lint + build
        run: |
          cd frontend
          npm ci
          # Layer-boundary linter (platform/engine/theme separation). A
          # cross-layer import (e.g. platform/ importing theme routes/) fails
          # the build here — this is what keeps the engine/theme split from
          # silently re-coupling. Contract:
          # docs/features/theming-substrate/SURFACES.md §"Layer boundary contract".
          npm run lint
          npm run build

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked
