name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; this workflow doesn't write to the repo.
permissions:
  contents: read

# When new commits land on a branch, cancel still-running CI for older commits
# on the same branch — saves runner minutes and gets fresh signal faster.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      # If macOS breaks, we still want to see whether Windows and Linux passed.
      fail-fast: false
      matrix:
        include:
          # Windows is the dev platform — exercise the full workspace including
          # the Tauri shell.
          - os: windows-latest
            cargo-args: "--workspace --locked"
          # macOS and Linux skip the Tauri shell crate. Tauri's Linux deps
          # (webkit2gtk, gtk, glib) are heavy, and we can't run/validate the
          # shell binary on those platforms today anyway. CI here exists to
          # catch cross-platform drift in the emulation crates (oa-pce-sys,
          # oa-render, oa-audio, oa-input, etc.) — that's where the C/C++
          # FFI risk lives.
          - os: macos-latest
            cargo-args: "--workspace --exclude oa-shell --locked"
          - os: ubuntu-latest
            cargo-args: "--workspace --exclude oa-shell --locked"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Linux runners are minimal. Our deps on Linux:
      #   - cpal (oa-audio)        → ALSA headers (libasound2-dev)
      #   - gilrs (oa-input)       → udev          (libudev-dev)
      #   - device_query (oa-input) → X11 + XInput + XTest dev headers
      # Windows + macOS have the equivalents preinstalled.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            pkg-config

      - name: cargo build
        run: cargo build ${{ matrix.cargo-args }}

      - name: cargo test
        run: cargo test ${{ matrix.cargo-args }}
