system_info:
  system_id: lynx
  manufacturer: Atari Corporation
  type: Handheld
  generation: 4th Generation
  release_date: September 1, 1989 (NA) / 1990 (EU, JP)
  discontinued: 1995
  units_sold: ~2 Million
  media: Cartridge
  cpu: VLSI VL65NC02 (Mikey package) @ 4 MHz
  sound: Mikey — 4 channels, 8-bit DAC per channel
  resolution: 160 x 102 (backlit 3.5" LCD)
  color_palette: 4,096 colors (16 simultaneous per scanline)
  architecture: 8-Bit CPU / 16-Bit Graphics (Suzy)
  max_players: 1-8 Players (via ComLynx daisy-chain)
  multiplayer: Yes — up to 8 via ComLynx serial cable
  region: Regionless
  storage: Cartridge (128 KB - 1 MB)
  ram: 64 KB
  aspect_ratio: ~1.57:1 (160:102)
  peripherals:
  - name: ComLynx Cable
    glyph: 🔗
  - name: Headphone Jack (mono on Lynx I, stereo on Lynx II)
    glyph: 🎧
  release_flag: 🇺🇸
  tagline: COLOR HANDHELD
  blurb: The first handheld with a color backlit LCD, beating the Game Gear by a year and outclassing the Game Boy on every spec. Lost the market to Nintendo despite genuinely revolutionary hardware. Lynx II (July 1991) shrank the form factor and added stereo audio. Famous for shooters, racers, and Lemmings — and for the fact that you could flip the screen upside-down for left-handed players.
  sidebar_subline: 8/16-BIT HANDHELD · 1989
