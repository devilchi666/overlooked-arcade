  system_id: virtualboy
  manufacturer: Nintendo
  type: Tabletop / Portable Console
  generation: 5th Generation
  release_date: July 21, 1995 (JP) / August 14, 1995 (NA); never released in EU
  discontinued: December 22, 1995 (JP) / August 1996 (NA)
  units_sold: ~770,000 (Nintendo's lowest-selling standalone console)
  media: Cartridge
  cpu: NEC V810 @ 20 MHz (32-bit RISC)
  sound: Custom VSU (6 PCM + 1 noise channels, stereo)
  resolution: 384 x 224 per eye (linear LED arrays with oscillating mirrors, ~50 Hz)
  color_palette: 4 shades of red
  architecture: 32-Bit
  max_players: 1 Player
  multiplayer: Link cable promised but never released
  region: NTSC / NTSC-J
  storage: Cartridge (1 MB - 2 MB) + SRAM in some carts
  ram: 64 KB work PSRAM / 128 KB graphics DRAM / 128 KB Video RAM
  video_output: Stereoscopic red LED arrays (one linear array per eye)
