    glyph: 🔌
  release_flag: 🇯🇵
  tagline: STEREOSCOPIC 32-BIT
  blurb: Nintendo's stereoscopic 3D experiment — a tabletop visor with twin red-LED displays that shipped before the technology was ready. Sold under a million units worldwide, killed within a year. Defended by enthusiasts for genuinely good games (Mario's Tennis, Virtual Boy Wario Land, Jack Bros.) hidden inside hardware that gave players headaches.
