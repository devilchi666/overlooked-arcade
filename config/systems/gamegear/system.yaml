  tagline: COLOR HANDHELD
  blurb: Sega's handheld counter to the Game Boy — landscape-oriented, full color LCD, and built on Master System hardware so much of the SMS library was straightforwardly ported. Lost to Nintendo's battery life and price, but cherished for genuinely colorful Sonic, Shinobi, and arcade ports. Battery-hungry to a legendary degree — 6 AAs lasted 3-5 hours.
