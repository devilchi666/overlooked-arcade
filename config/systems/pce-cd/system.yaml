system_info:
  system_id: pce-cd
  manufacturer: Hudson Soft (designed) / NEC Home Electronics (manufactured)
  type: Home Console Add-on
  generation: 4th Generation
  release_date: December 4, 1988 (JP — PC Engine CD-ROM²) / November 1989 (NA — TurboGrafx-CD)
  discontinued: ~1995 (with host TurboGrafx / PC Engine line)
  media: CD-ROM
  cpu: HuC6280 @ 7.16 MHz (host system)
  sound: HuC6280 PSG + CD-DA + ADPCM
  resolution: 256 x 239 (standard) up to 565 x 242 (hi-res mode)
  color_palette: 512 colors (482 simultaneous on-screen)
  display_ratio: 8:7 (4:3)
  architecture: 8-Bit CPU / Dual 16-Bit Graphics
  max_players: 1-5 Players (with TurboTap)
  multiplayer: Yes — up to 5 via TurboTap multiplayer adapter
  region: NTSC / NTSC-J (no PAL release)
  storage: CD-ROM (~600 MB) + 192 KB BRAM (save data)
  ram: 64 KB host + System Card BIOS 64 KB / Super System Card 256 KB / Arcade Card 2 MB
  video_output: RF / Composite / RGB
  aspect_ratio: 4:3
  peripherals:
  - name: TurboPad
    glyph: 🎮
  - name: TurboTap
    glyph: 🔗
  - name: System Card / Super System Card (BIOS)
    glyph: 💾
  - name: Arcade Card (Duo / Pro)
    glyph: 💾
  release_flag: 🇯🇵
  tagline: 8/16-BIT CD ADD-ON
  blurb: The world's first commercial CD-ROM add-on for a console — bolted onto the PC Engine and shipped a year before Sega CD. Defined the early-90s anime-cutscene-and-redbook-audio aesthetic; home to Ys, Snatcher, Lords of Thunder, and a deep library of import-only JRPGs and shooters.
  sidebar_subline: CD ADD-ON · 1988
