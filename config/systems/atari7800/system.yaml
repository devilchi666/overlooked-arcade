  tagline: 8-BIT ARCADE-AT-HOME
  blurb: Atari's late answer to the NES — a system designed to bring arcade-quality graphics home, with the MARIA custom graphics chip (running at 7.16 MHz — 4× the CPU clock) that genuinely outclassed Nintendo's PPU. Doomed by Atari's post-crash distribution collapse rather than the hardware itself. The first console with native backward compatibility — runs nearly the entire Atari 2600 catalog.
