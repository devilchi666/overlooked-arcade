# Nintendo DS — per-game records
#
# Slice 1 pilot for the per-system descriptor consolidation arc
# (docs/PLANS/per-system-descriptors.md). Migrated from the deleted
# docs/cores/nds/games-info.md — same GameInfo schema, now wrapped in
# a GamesDescriptor envelope.
#
# Coordinate notes for future contributors:
#   - touch_hotspot coordinates are in NDS bottom-screen native space
#     (0..256 wide × 0..192 tall); x grows rightward, y grows downward
#   - Hotspots are reference visuals only — operators flip the
#     "Show touch hints" toggle in QuickSettings (Esc-overlay) when
#     they need orientation; actual touch input flows from the mouse
#     cursor + click via melonDS's RETRO_DEVICE_POINTER dispatch
#   - Use round numbers when you can (8-pixel grid feels right); exact
#     pixel alignment matters less than "the box is roughly where the
#     game's tappable region is"

schema_version: 1

games:
  - id_key:
      system_id: nds
      rom_title: "The Legend of Zelda: Phantom Hourglass (USA)"
    date: 2007
    publisher: Nintendo
    region: USA
    player_count: 1
    genre: Action-Adventure
    controls_supported:
      - "Touchscreen"
      - "Standard gamepad (menus)"
    short_summary: "Stylus-driven Zelda. Movement, attacks, item targeting all flow through the bottom screen."
    # Bottom-screen hotspot map for the main exploration view. Phantom
    # Hourglass repurposes the bottom screen as the playfield — most
    # of the visible area is "tap to move," with corner widgets for
    # the inventory + map. These four boxes cover the persistent UI;
    # the rest of the screen is "free tap."
    touch_hotspots:
      - { label: "Map",         x: 200, y: 8,   w: 48, h: 32 }
      - { label: "Items",       x: 8,   y: 8,   w: 48, h: 32 }
      - { label: "Menu",        x: 8,   y: 152, w: 48, h: 32 }
      - { label: "Speak/Action", x: 200, y: 152, w: 48, h: 32 }
    meta:
      schema_version: 1
      last_updated: "2026-05-31"
      contributors: []

  - id_key:
      system_id: nds
      rom_title: "Brain Age: Train Your Brain in Minutes a Day! (USA)"
    date: 2006
    publisher: Nintendo
    region: USA
    player_count: 1
    genre: Puzzle / Educational
    controls_supported:
      - "Touchscreen"
      - "Microphone (some exercises)"
    short_summary: "Daily brain-training exercises. Most input is hand-drawn digits or letters in the answer zone; the rest of the screen is timer + instructions."
    # Brain Age's answer-writing zone is the entire right pane in
    # landscape-style exercises, or the lower half in stacked-prompt
    # exercises. The hotspot here marks the typical "write your
    # answer" zone — operators flipping the toggle ON during a "20
    # Calculations" round see exactly where to draw.
    touch_hotspots:
      - { label: "Answer zone",  x: 128, y: 16,  w: 120, h: 160 }
      - { label: "Menu / Done",  x: 8,   y: 152, w: 48,  h: 32 }
    meta:
      schema_version: 1
      last_updated: "2026-05-31"
      contributors: []

  - id_key:
      system_id: nds
      rom_title: "Trauma Center: Under the Knife (USA)"
    date: 2005
    publisher: Atlus
    region: USA
    player_count: 1
    genre: Simulation
    controls_supported:
      - "Touchscreen"
      - "Standard gamepad (menus)"
    short_summary: "Stylus-driven surgery sim. Tool palette runs along the left edge; incision / suture / drain actions happen across the patient area."
    # Trauma Center's UI puts a vertical tool palette down the left
    # side of the bottom screen. The remaining ~200px of width is the
    # patient view — operator drags the stylus across the patient to
    # perform actions with whichever tool is selected.
    touch_hotspots:
      - { label: "Tools",         x: 4,  y: 8, w: 40,  h: 176 }
      - { label: "Patient view",  x: 48, y: 8, w: 200, h: 176 }
    meta:
      schema_version: 1
      last_updated: "2026-05-31"
      contributors: []
