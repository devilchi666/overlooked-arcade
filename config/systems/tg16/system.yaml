  blurb: NEC's compact answer to Nintendo and Sega — an 8-bit CPU paired with dual 16-bit graphics chips. Outsold the Famicom in Japan during its peak years, but never broke through in the West. Famous for vibrant shoot-'em-ups, Bonk, and a HuCard library packed onto credit-card-sized cartridges.
