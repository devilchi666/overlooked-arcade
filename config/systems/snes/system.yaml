system_info:
  system_id: snes
  manufacturer: Nintendo
  type: Home Console
  generation: 4th Generation
  release_date: November 21, 1990 (JP — Super Famicom) / August 23, 1991 (NA) / April 11, 1992 (PAL)
  discontinued: 1999 (NA) / September 25, 2003 (JP Super Famicom)
  units_sold: 49.10 Million
  media: Cartridge
  cpu: Ricoh 5A22 @ 3.58 MHz (slowdowns to 2.68 / 1.79 MHz on slow peripherals)
  sound: Sony SPC700 + 16-bit DSP — 8 voices, stereo
  resolution: 256 x 224 (standard) / up to 512 x 448 (hi-res / interlaced)
  color_palette: 32,768 colors (up to 256 simultaneous on-screen)
  display_ratio: 8:7 (4:3)
  architecture: 16-Bit
  max_players: 1-2 Players (up to 5 via Super Multitap)
  multiplayer: Yes — 2 local; up to 5 via Super Multitap
  region: NTSC / PAL (region-locked via cartridge chip)
  storage: Cartridge (2 Mbit - 48 Mbit / 256 KB - 6 MB)
  ram: 128 KB work / 64 KB SRAM / 64 KB PSRAM (audio) / 64 KB VRAM
  video_output: Composite / S-Video / RGB
  aspect_ratio: 4:3
  peripherals:
  - name: SNES Controller
    glyph: 🎮
  - name: Super Scope
    glyph: 🔫
  - name: SNES Mouse
    glyph: 🖱️
  - name: Super Multitap (X4)
    glyph: 🔗
  - name: Satellaview (JP)
    glyph: 📡
  release_flag: 🇯🇵
  tagline: 16-BIT HOME CONSOLE
  blurb: Nintendo's second home console and the successor to the NES. Famous for its vast library of RPGs, platformers, and classics that defined a generation of gaming.
