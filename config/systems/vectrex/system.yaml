system_info:
  system_id: vectrex
  manufacturer: Smith Engineering (designed) / GCE — General Consumer Electronics (1982-83) / Milton Bradley (1983-84)
  type: Home Console (Built-in Display)
  generation: 2nd Generation
  release_date: October 1982 (NA) / 1983 (EU, JP via Bandai as Kōsokusen)
  discontinued: February 1984
  units_sold: estimated ~500,000 (Milton Bradley reported $31.6M loss)
  media: Cartridge + Overlay
  cpu: Motorola MC68A09 @ 1.5 MHz
  sound: General Instrument AY-3-8912 (3 channels)
  resolution: Vector graphics (no raster)
  color_palette: Monochrome with translucent plastic overlays
  architecture: 8-Bit
  max_players: 1-2 Players
  multiplayer: Yes — 2 via dual controller ports
  region: NTSC
  storage: Cartridge (up to 32 KB)
  ram: 1 KB / 8 KB on-board ROM
  video_output: Built-in 9-inch monochrome vector CRT
  aspect_ratio: 3:4 (portrait CRT)
  peripherals:
  - name: Vectrex Controller
    glyph: 🎮
  - name: 3-D Imager (spinning color filter)
    glyph: 🥽
  - name: Light Pen
    glyph: 🖊️
  - name: Color Overlay Sheets
    glyph: 🌈
  release_flag: 🇺🇸
  tagline: VECTOR-GRAPHICS HOME CONSOLE
  blurb: The only consumer console ever built around vector graphics — a self-contained unit with a 9-inch portrait CRT, plastic color overlays for the bezel, and a library of arcade-vector ports (Star Castle, Berzerk, Star Trek). Died in the 1983 crash but spawned a passionate homebrew scene that still ships new cartridges today.
  sidebar_subline: VECTOR · 1982
