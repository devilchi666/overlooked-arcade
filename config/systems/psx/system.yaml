  cpu: "MIPS R3000A @ 33.86 MHz"
  sound: "SPU 24-channel"
  resolution: "640 x 480 max"
  color_palette: "16.7 Million"
  display_ratio: "4:3"

  architecture: 32-Bit
  max_players: "1-2 Players (Multitap up to 8)"
  multiplayer: "Yes — 2 local; up to 8 via Multitap"
  region: "NTSC / PAL / NTSC-J"
  storage: "Memory Card (128KB)"
  ram: "2MB"
  video_output: "Composite / S-Video / RGB"
  aspect_ratio: "4:3"

  peripherals:
    - name: Digital Controller
      glyph: "🎮"
    - name: DualShock
      glyph: "🎮"
    - name: Multitap
      glyph: "🔗"
    - name: GunCon
      glyph: "🔫"
    - name: Mouse
      glyph: "🖱️"

  release_flag: "🇯🇵"
