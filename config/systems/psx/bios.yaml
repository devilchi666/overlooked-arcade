# PlayStation — BIOS table
#
# Slice 1 pilot for the per-system descriptor consolidation arc
# (docs/PLANS/per-system-descriptors.md). Migrated verbatim from
# main.rs::PSX_BIOS_KNOWN_HASHES.
#
# Beetle PSX HW (the default psx core) requires a regional BIOS in
# <exe_dir>/system/ matching the disc's region. PSX region-locking is
# enforced at the BIOS level — JP discs need scph5500, US discs need
# scph5501, EU discs need scph5502. All 18 entries below cover the
# canonical regional + revision variants Mednafen-derived cores
# accept.
#
# Beetle PSX SW + SwanStation + PCSX-ReARMed share this same BIOS
# file set.

schema_version: 1
semantics: any_of
required_for_launch: true

sourcing_hint: >-
  PSX BIOS dumps are not shipped with OA. Dump from your own PSX or
  use a backup of your own dump.

files:
