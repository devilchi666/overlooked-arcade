system_info:
  system_id: msx
  manufacturer: ASCII Corporation + Microsoft (standard) — Sony, Panasonic, Sanyo, Toshiba, Yamaha, Pioneer, Philips, Canon, Casio, Fujitsu, Sharp (manufacturers)
  type: Home Computer
  generation: 3rd Generation
  release_date: October 21, 1983 (JP, Mitsubishi ML-8000 first sale)
  discontinued: mid-1980s (MSX1 line; MSX2 launched 1985)
  units_sold: ~4-9 Million (disputed — Wikipedia notes "9 Million worldwide" vs Nishi's claim of "3M JP + 1M overseas")
  media: Cartridge / Cassette / Floppy Disk
  cpu: Zilog Z80A @ 3.58 MHz
  sound: General Instrument AY-3-8910 PSG (3 channels)
  resolution: 256 x 192
  color_palette: 16 colors
  architecture: 8-Bit
  max_players: 1-2 Players
  multiplayer: Yes — 2 via joystick ports
  region: Worldwide (multi-manufacturer; strong in JP, KR, BR, NL, ES, AR)
  storage: Cartridge (32 KB - 4 MB via mapper) / Floppy / Cassette
  ram: 8 KB minimum, most models 32 or 64 KB
  video_output: RF / Composite / RGB
  aspect_ratio: 4:3
  peripherals:
  - name: Keyboard (built-in)
    glyph: ⌨️
  - name: Joystick
    glyph: 🕹️
  - name: Cassette Drive
    glyph: 📼
  - name: Floppy Drive
    glyph: 💾
  release_flag: 🇯🇵
  tagline: 8-BIT HOME COMPUTER STANDARD
  blurb: A 1983 cross-manufacturer hardware spec — the closest the 8-bit era got to a global PC standard. Built by a dozen Japanese firms (Sony, Panasonic, Sanyo, Yamaha…) plus Philips in Europe. Dominant in Japan, Brazil, Spain, and the Netherlands. The home of Konami's Z80 masterpieces (Metal Gear's original release, Vampire Killer, Salamander).
  sidebar_subline: 8-BIT COMPUTER · 1983
