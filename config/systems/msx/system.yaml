  blurb: A 1983 cross-manufacturer hardware spec — the closest the 8-bit era got to a global PC standard. Built by a dozen Japanese firms (Sony, Panasonic, Sanyo, Yamaha…) plus Philips in Europe. Dominant in Japan, Brazil, Spain, and the Netherlands. The home of Konami's Z80 masterpieces (Metal Gear's original release, Vampire Killer, Salamander).
