id: saturn
display_name: Sega Saturn
short_name: Saturn
schema_version: 1
default_core: mednafen_saturn_libretro.dll
default_shader_preset: crt-lite
extensions:
- cue
- chd
- ccd
- toc
- m3u
- iso
libretro_dat_refs:
- subdir: metadat/redump
  basename: Sega - Saturn
cores:
- base: mednafen_saturn_libretro
  display_name: Beetle Saturn
  blurb: Sega Saturn — Mednafen-derived, high accuracy. Demanding.
  recommended: true
  bios_required: sega_101.bin (or equivalent)
- base: kronos_libretro
  display_name: Kronos
  blurb: Faster Saturn core. Lower accuracy, broader hardware reach.
  bios_required: sega_101.bin (or equivalent)
- base: yabasanshiro_libretro
  display_name: YabaSanshiro
  blurb: Yabause-derived Saturn core.
  bios_required: sega_101.bin (or equivalent)
- base: yabause_libretro
  display_name: Yabause
  blurb: Older Saturn core, original Yabause branch.
  bios_required: sega_101.bin (or equivalent)
# Default Saturn pad is digital-only; the 3D Pad is selected via core
# options per-game (NiGHTS, Sega Rally, Panzer Dragoon Saga). Surfacing
# the analog UI regardless so operators using 3D Pad mode have the
# panel — empty analog routing is harmless on the digital-only games.
analog_sticks:
  kind: single
  left_label: Analog Stick (3D Pad)
